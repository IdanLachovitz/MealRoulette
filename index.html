<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <!-- Two tags, not one: Safari colours the status-bar/toolbar strip from
         whichever matches the OS's own light/dark setting, natively and
         instantly — no flash of white, no dependency on JS running first or
         on a later content-attribute mutation actually repainting (iOS
         Safari doesn't reliably repaint from a single dynamically-updated
         tag). state.tsx only touches these when the in-app theme choice
         overrides the OS setting (see the comment there) — the "system"
         case needs no JS at all. -->
    <meta name="theme-color" content="#f7f3f8" media="(prefers-color-scheme: light)" id="theme-color-light" />
    <meta name="theme-color" content="#15110d" media="(prefers-color-scheme: dark)" id="theme-color-dark" />
    <meta name="description" content="תכנון בישולים שבועי עם רולטת בחירה" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" paints a fixed white status bar no matter the in-app theme
         — a white strip across the notification icons when the app itself is
         dark. "black-translucent" makes iOS draw the status bar transparent
         over the page instead, so it just shows whatever's already there —
         the app's own themed background, dark or light, no separate colour
         to keep in sync. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="מה מבשלים" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500&family=Heebo:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <title>מה מבשלים השבוע</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
